<div class="ou-page-header {% if class_name %}{{ class_name }}{% endif %}">
  <div class="ou-page-header-main">
    {% if title %}
      <h1 class="ou-page-title">{{ title }}</h1>
    {% endif %}
    {% if subtitle %}
      <p class="ou-page-subtitle">{{ subtitle }}</p>
    {% endif %}
  </div>
  {% if actions_template %}
    <div class="ou-page-header-actions">
      {% include actions_template %}
    </div>
  {% endif %}
</div>
