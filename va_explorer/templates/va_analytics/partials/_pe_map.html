<section class="sectionContainer mapView" id="peMapSection" data-component="map">
  <h2>Geographic Distribution</h2>
  <div class="controls">
    <label for="peMapViewSelect">Map View:</label>
    <div class="select">
      <select id="peMapViewSelect">
        <option value="Province" {% if filter_map_view == "Province" %}selected{% endif %}>Province</option>
        <option value="District" {% if filter_map_view == "District" %}selected{% endif %}>District</option>
      </select>
    </div>
  </div>
  <div id="peMapContainer">
    <div id="peMapLegend" class="legend"></div>
  </div>
  <p id="peMapEmpty" class="po-empty-state" hidden>No geographic data available for the selected filters.</p>
</section>
