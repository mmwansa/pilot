<section class="sectionContainer mapView" id="deathsMapSection" data-component="map">
  <h2>Geographic Distribution</h2>
  <div class="controls">
    <label for="deathsMapViewSelect">Map View:</label>
    <div class="select">
      <select id="deathsMapViewSelect">
        <option value="Province">Province</option>
        <option value="District">District</option>
      </select>
    </div>
  </div>
  <div id="deathsMapContainer">
    <div id="deathsMapLegend" class="legend"></div>
  </div>
  <p id="deathsMapEmpty" class="po-empty-state" hidden>No geographic mortality data available for the selected filters.</p>
</section>
