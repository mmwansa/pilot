<form id="poFiltersForm" class="controls" data-component="filters" method="get" action="{% url 'va_analytics:outcomes-dashboard' %}">
  <small class="dashboard-note">
    Note: this dashboard visualizes coded pregnancy outcomes and all charts sum to the coded total above.
  </small>

  <div class="filtersRow">
    <label for="poMapViewSelect">Map:</label>
    <select id="poMapViewSelect" class="select">
      <option value="Province" {% if filter_map_view == "Province" %}selected{% endif %}>Province</option>
      <option value="District" {% if filter_map_view == "District" %}selected{% endif %}>District</option>
    </select>

    <div class="mainFiltersContainer">
      <label for="poFilterPregnancyOutcome">Pregnancy Outcome:</label>
      <select id="poFilterPregnancyOutcome" class="select" name="pregnancy_outcome">
        <option value="">All</option>
        {% for option in pregnancy_outcome_options %}
          <option value="{{ option }}" {% if filter_pregnancy_outcome == option %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="betweenDatesContainer">
      <label for="poFilterTimePreset">DOB:</label>
      <select id="poFilterTimePreset" class="select" name="time_preset">
        <option value="all_time" {% if filter_time_preset == "all_time" %}selected{% endif %}>All time</option>
        <option value="last_30_days" {% if filter_time_preset == "last_30_days" %}selected{% endif %}>Last 30 days</option>
        <option value="last_7_days" {% if filter_time_preset == "last_7_days" %}selected{% endif %}>Last 7 days</option>
        <option value="last_24_hours" {% if filter_time_preset == "last_24_hours" %}selected{% endif %}>Last 24 hours</option>
        <option value="custom" {% if filter_time_preset == "custom" %}selected{% endif %}>Custom</option>
      </select>

      <div class="customDatesContainer">
        <span>Between</span>
        <label for="poFilterStartDatetime" class="sr-only">Start Date</label>
        <input id="poFilterStartDatetime" class="input" type="date" name="start_datetime" value="{{ filter_start_datetime }}">
        <span>and</span>
        <label for="poFilterEndDatetime" class="sr-only">End Date</label>
        <input id="poFilterEndDatetime" class="input" type="date" name="end_datetime" value="{{ filter_end_datetime }}">
      </div>

    </div>

    <div class="formBtnsContainer">
      <button id="poFiltersReset" type="button" class="button resetBtn">Reset</button>
    </div>
  </div>
  <input type="hidden" id="poFilterMapView" name="map_view" value="{{ filter_map_view }}">
</form>
