<h2>Place of Death Distribution</h2>
<div class="chart-mode-toggle">
  <input id="deathsPlaceModeCount" type="radio" value="count" name="deaths_place_mode" checked>
  <label for="deathsPlaceModeCount">Count</label>
  <input id="deathsPlaceModePercentage" type="radio" value="percentage" name="deaths_place_mode">
  <label for="deathsPlaceModePercentage">Percentage</label>
</div>
<div class="chartsContainer">
  <div class="chart-canvas-wrap">
    <canvas id="deathsPlaceChart" data-component="place-chart"></canvas>
  </div>
</div>
<p id="deathsPlaceEmpty" class="po-empty-state" hidden>No place-of-death data available for the selected filters.</p>
