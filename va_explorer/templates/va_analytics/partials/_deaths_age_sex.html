<h2>Mortality by Age Group and Sex</h2>
<div>
  <input id="deathsAgeSexModeCount" type="radio" value="count" name="deaths_age_sex_mode" checked>
  <label for="deathsAgeSexModeCount" style="vertical-align: super; font-size: 12px">Count</label>
  <input id="deathsAgeSexModePercentage" type="radio" value="percentage" name="deaths_age_sex_mode">
  <label for="deathsAgeSexModePercentage" style="vertical-align: super; font-size: 12px">Percentage</label>
</div>
<div class="chartsContainer">
  <div style="height: 260px;">
    <canvas id="deathsAgeSexChart" data-component="age-sex-chart"></canvas>
  </div>
</div>
<p id="deathsAgeSexEmpty" class="po-empty-state" hidden>No age-sex mortality data available for the selected filters.</p>
