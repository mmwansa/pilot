<div class="highlightsContainer" id="poSummaryCards" data-component="summary">
  <div class="highlight">
    <h3>Last Data Update</h3>
    <p id="poCardLastDataUpdate">{{ card_last_data_update }}</p>
  </div>
  <div class="highlight">
    <h3>Last Event Date</h3>
    <p id="poCardLastEventDate">{{ card_last_event_date }}</p>
  </div>
  <div class="highlight">
    <h3>Number of Events</h3>
    <p id="poCardNumberOfEvents">{{ card_number_of_events }}</p>
  </div>
  <div class="highlight">
    <h3>% of Events: Multiple Birth</h3>
    <p id="poCardMultipleBirthPct">{{ card_multiple_birth_pct }}%</p>
  </div>
</div>
<p id="poSummaryEmpty" class="po-empty-state" hidden>No pregnancy outcomes data available for the selected filters.</p>
