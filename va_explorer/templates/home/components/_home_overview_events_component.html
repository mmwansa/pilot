<section id="novEventsChartContainer" class="events-chart-container" data-component="events-chart-container">
  <div class="nov-kpi-cards nov-kpi-cards-inline mb-3">
    <article class="nov-kpi-card">
      <h6>Number of Clusters Visited</h6>
      <div class="nov-kpi-metrics">
        <div><span>Today</span><strong id="nov-kpi-today-eas">0</strong></div>
        <div><span>This week</span><strong id="nov-kpi-week-eas">0</strong></div>
        <div><span>Cummulative Total</span><strong id="nov-kpi-total-eas">0</strong></div>
      </div>
    </article>
    <article class="nov-kpi-card">
      <h6>Number of households</h6>
      <div class="nov-kpi-metrics">
        <div><span>Today</span><strong id="nov-kpi-today-households">0</strong></div>
        <div><span>This week</span><strong id="nov-kpi-week-households">0</strong></div>
        <div><span>Cummulative Total</span><strong id="nov-kpi-total-households">0</strong></div>
      </div>
    </article>
    <article class="nov-kpi-card">
      <h6>Number of people counted</h6>
      <div class="nov-kpi-metrics">
        <div><span>Today</span><strong id="nov-kpi-today-people">0</strong></div>
        <div><span>This week</span><strong id="nov-kpi-week-people">0</strong></div>
        <div><span>Cummulative Total</span><strong id="nov-kpi-total-people">0</strong></div>
      </div>
    </article>
  </div>
  <div class="events-chart-canvas-wrap">
    <canvas id="novEventsChart" data-component="events-trend-chart"></canvas>
  </div>
</section>
