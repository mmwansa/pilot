<h2 class="mb-4">Collection Trends</h2>
<div class="row">
  <div class="col-md-6 mb-4">
    <section class="home-panel trend-metric-card">
      <h5>Households</h5>
      <table class="table table-sm home-page-statistics trend-metric-table mb-3">
        <thead>
          <tr>
            <th>Metric</th>
            <th>24 hours</th>
            <th>1 week</th>
            <th>1 month</th>
            <th>Overall</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Recorded</td>
            <td id="households-past-24-hours">0</td>
            <td id="households-past-week">0</td>
            <td id="households-past-month">0</td>
            <td id="households-past-overall">0</td>
          </tr>
        </tbody>
      </table>
      <div class="trend-chart-wrap"><canvas id="householdsChart" data-component="households-trend-chart"></canvas></div>
    </section>
  </div>
